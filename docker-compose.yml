# Levanta PostgreSQL + la aplicación Atlas Marino con un solo comando:
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oceano_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oceano_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: milisen03narvaez/atlas-marino:latest
    container_name: atlas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/oceano_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      UPLOADS_DIR: /app/uploads
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
