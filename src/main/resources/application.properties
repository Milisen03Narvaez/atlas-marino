# ============================================================================
# application.properties = configuración central de Spring Boot.
# Spring la lee al arrancar y la reparte a todos los componentes.
# ============================================================================

spring.application.name=atlas-marino
server.port=8080
# Redirecciones con ruta relativa (/admin/login): necesario cuando la app queda detrás de AWS API Gateway (ATL-4),
# para que el navegador nunca reciba la dirección interna del servidor.
server.tomcat.use-relative-redirects=true

# --- CONEXIÓN A POSTGRESQL (la usa Spring Data JPA, que alimenta a AnimalRepository) ---
# Formato: jdbc:postgresql://HOST:PUERTO/NOMBRE_BASE_DE_DATOS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oceano_db}
spring.datasource.username=${DB_USER:postgres}
# Formato ${VARIABLE:valor_por_defecto}: en Docker se leen de las variables de entorno (docker-compose.yml);
# al correr en IntelliJ se usa el valor por defecto. Pon tu contraseña local en la variable DB_PASSWORD
# (Run > Edit Configurations > Environment variables), NO la escribas aquí para no subirla a GitHub.
spring.datasource.password=${DB_PASSWORD:}

# --- HIBERNATE / JPA ---
# update = crea/ajusta la tabla "animales" automáticamente a partir de la clase Animal (model).
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate (útil para estudiar; ponlo en false si molesta).
spring.jpa.show-sql=true
# Evita mantener la sesión de base de datos abierta mientras se pinta la vista.
spring.jpa.open-in-view=false

# --- THYMELEAF ---
# cache=false: al editar un .html en IntelliJ se ve el cambio sin reiniciar (solo para desarrollo).
spring.thymeleaf.cache=false

# --- SUBIDA DE IMÁGENES DESDE EL ADMIN ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Carpeta (relativa a la raíz del proyecto) donde se guardan las imágenes subidas.
# La lee AnimalService con @Value. En Docker apunta a /app/uploads (volumen).
atlas.uploads.dir=${UPLOADS_DIR:uploads}

# --- CREDENCIALES DEL ADMIN (las lee AnimalController con @Value) ---
# CÁMBIALAS antes de mostrar o publicar el proyecto.
atlas.admin.usuario=${ADMIN_USER:admin}
atlas.admin.clave=${ADMIN_PASSWORD:admin123}

# Duración de la sesión del admin
server.servlet.session.timeout=30m